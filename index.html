<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<title>Receptesdoboz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">

<style>
  :root{
    --linen:#EDE7DB;
    --card:#FFFCF5;
    --ink:#221F1A;
    --muted:#77705F;
    --line:#DCD3C2;
    --herb:#2C5545;
    --gold:#B07E1E;
    --plum:#6B3B57;
    --sky:#31586E;
    --radius:4px;
  }
  *{box-sizing:border-box}
  html{
    background:#EDE7DB !important;
    color-scheme:light only;
    -webkit-text-size-adjust:100%;
  }
  html,body{margin:0;padding:0;min-height:100%}
  body{
    background:#EDE7DB !important;
    color:var(--ink);
    font-family:"Source Serif 4",Georgia,"Times New Roman",serif;
    font-size:17px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  @media (prefers-color-scheme:dark){
    html,body{background:#EDE7DB !important;color:#221F1A}
  }
  .wrap{max-width:640px;margin:0 auto;padding:20px 16px 96px}
  h1,h2,h3,.ui{font-family:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif}

  /* --- fejléc --- */
  header{margin:8px 0 22px}
  h1{
    font-size:34px;line-height:1.05;letter-spacing:-.02em;font-weight:700;
    margin:0 0 6px;
  }
  .count{color:var(--muted);font-size:14px;margin:0}
  .bar{display:flex;gap:8px;margin-top:18px}
  input[type=search],input[type=text],input[type=number],textarea,select{
    font:inherit;color:var(--ink);background:var(--card);
    border:1px solid var(--line);border-radius:var(--radius);
    padding:10px 12px;width:100%;
  }
  input:focus-visible,textarea:focus-visible,button:focus-visible,select:focus-visible,
  .card:focus-visible{outline:2px solid var(--herb);outline-offset:2px}
  textarea{min-height:130px;resize:vertical;line-height:1.5}

  button{font-family:"Bricolage Grotesque",Arial,sans-serif;font-size:15px;cursor:pointer}
  .btn{
    background:var(--herb);color:#FFFCF5;border:none;border-radius:var(--radius);
    padding:11px 16px;font-weight:600;white-space:nowrap;
  }
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  .btn.danger{background:transparent;color:#8C2F22;border:1px solid #E0C4BE}
  .btn:active{transform:translateY(1px)}

  /* --- szűrő --- */
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 4px}
  .chip{
    background:transparent;border:1px solid var(--line);color:var(--muted);
    border-radius:999px;padding:5px 12px;font-size:13px;
  }
  .chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--card)}
  .chip em{font-style:normal;opacity:.55;font-size:12px;margin-left:2px}
  .chip.grp{border-style:dashed}

  .tagmgr{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0 2px}
  .tagmgr input{flex:1;min-width:130px;padding:8px 10px;font-size:15px}
  .tagmgr .btn{padding:8px 12px;font-size:14px}

  .taglist{margin:5px 0 0;display:flex;flex-wrap:wrap;gap:4px}
  .taglist span{
    font-family:"Bricolage Grotesque",Arial,sans-serif;font-size:11.5px;
    color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 8px;
  }
  .taglist.big span{font-size:13px;padding:3px 11px;margin-top:6px}

  .grouphead{
    list-style:none;font-family:"Bricolage Grotesque",Arial,sans-serif;
    font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
    color:var(--tab,var(--muted));margin:16px 0 -2px;padding-left:2px;
  }
  .grouphead:first-child{margin-top:2px}
  .grouphead em{font-style:normal;opacity:.55;letter-spacing:0}

  .tagedit{display:flex;flex-wrap:wrap;gap:6px;min-height:24px;align-items:center}
  .tagchip{
    background:var(--linen);border:1px solid var(--line);border-radius:999px;
    padding:5px 11px;font-size:14px;color:var(--ink);
  }
  .tagchip b{opacity:.5;margin-left:3px;font-weight:400}

  /* --- kártyalista --- */
  ul.list{list-style:none;margin:18px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
  .card{
    display:flex;align-items:center;gap:14px;width:100%;text-align:left;position:relative;
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:12px 12px 12px 22px;font:inherit;color:inherit;
  }
  .card .txt{flex:1;min-width:0}
  .thumb{
    position:relative;flex:none;width:76px;height:76px;overflow:hidden;
    border-radius:3px;background:var(--linen);border:1px solid var(--line);
  }
  .thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
  .thumb svg{display:block;width:100%;height:100%}
  .thumb.big{width:104px;height:104px}
  @media (min-width:520px){ .thumb.big{width:132px;height:132px} }
  .card::before{
    content:"";position:absolute;left:0;top:-1px;bottom:-1px;width:6px;
    background:var(--tab,var(--herb));border-radius:var(--radius) 0 0 var(--radius);
  }
  .card h3{margin:0;font-size:19px;font-weight:600;letter-spacing:-.01em}
  .meta{margin:3px 0 0;font-size:13px;color:var(--muted)}
  .empty{
    border:1px dashed var(--line);border-radius:var(--radius);
    padding:34px 20px;text-align:center;color:var(--muted);margin-top:18px
  }

  /* --- réteg (részletek / űrlap) --- */
  .sheet{
    position:fixed;inset:0;background:var(--linen);overflow-y:auto;
    z-index:20;display:none;
  }
  .sheet.open{display:block}
  .sheet .wrap{padding-top:14px}
  .sheettop{
    position:sticky;top:0;background:var(--linen);z-index:2;
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding:10px 0 12px;border-bottom:1px solid var(--line);margin-bottom:18px;
  }
  .back{background:none;border:none;padding:6px 0;color:var(--muted);font-size:15px}

  .recipe-title{font-size:28px;line-height:1.1;margin:0 0 4px;letter-spacing:-.02em}
  .source{font-size:13px;color:var(--muted);word-break:break-all}
  .source a{color:var(--herb)}

  .adag{
    display:flex;align-items:center;gap:14px;margin:20px 0;
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;
  }
  .adag span{font-size:14px;color:var(--muted);font-family:"Bricolage Grotesque",Arial,sans-serif}
  .step-btn{
    width:34px;height:34px;border-radius:50%;border:1px solid var(--line);
    background:var(--linen);font-size:19px;line-height:1;color:var(--ink)
  }
  .adag b{font-size:19px;min-width:2ch;text-align:center;font-family:"Bricolage Grotesque",Arial,sans-serif}

  h2.sec{font-size:14px;font-weight:700;letter-spacing:.04em;margin:26px 0 10px;color:var(--muted)}
  ul.ingr{list-style:none;margin:0;padding:0}
  ul.ingr li{border-bottom:1px solid var(--line)}
  ul.ingr label{display:flex;gap:11px;align-items:flex-start;padding:9px 2px;cursor:pointer}
  ul.ingr input{margin-top:6px;width:17px;height:17px;accent-color:var(--herb);flex:none}
  ul.ingr input:checked + span{color:var(--muted);text-decoration:line-through}
  ol.steps{margin:0;padding-left:1.3em}
  ol.steps li{margin-bottom:14px;padding-left:4px}
  .notes{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;font-style:italic}
  .rowbtns{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:34px 0 10px}
  .confirmq{flex:1;min-width:150px;font-size:15px;
    font-family:"Bricolage Grotesque",Arial,sans-serif}
  .btn.danger.solid{background:#8C2F22;color:#FFFCF5;border-color:#8C2F22}

  /* --- űrlap --- */
  .field{margin-bottom:16px}
  .field label{display:block;font-size:14px;font-weight:600;margin-bottom:5px;
    font-family:"Bricolage Grotesque",Arial,sans-serif}
  .hint{font-size:13px;color:var(--muted);margin:4px 0 0}
  .two{display:flex;gap:10px}
  .two .field{flex:1}
  .actions{
    position:fixed;left:0;right:0;bottom:0;z-index:10;padding:26px 16px 16px;
    background:linear-gradient(to top, var(--linen) 58%, rgba(237,231,219,0));
  }
  .actions .inner{max-width:640px;margin:0 auto;display:flex;gap:8px}
  .actions .btn{flex:1;padding:14px 12px;font-size:16px;
    box-shadow:0 2px 10px rgba(34,31,26,.12)}
  .actions .btn.ghost{background:var(--card)}

  .paste{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:0 14px;margin-bottom:22px;
  }
  .paste summary{
    cursor:pointer;padding:12px 0;font-size:15px;font-weight:600;
    font-family:"Bricolage Grotesque",Arial,sans-serif;
  }
  .paste .inner{padding-bottom:14px}
  .paste textarea{min-height:120px;font-size:15px;background:var(--linen)}
  .filepick{display:flex;align-items:center;gap:10px;margin-top:8px}
  .filepick input[type=file]{font-size:14px;font-family:"Bricolage Grotesque",Arial,sans-serif}

  .toast{
    position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
    background:var(--ink);color:var(--card);padding:10px 18px;border-radius:999px;
    font-family:"Bricolage Grotesque",Arial,sans-serif;font-size:14px;z-index:60;
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap" id="home">
  <header>
    <h1>Receptesdoboz</h1>
    <p class="count" id="count"></p>
    <div class="bar">
      <input type="search" id="q" placeholder="Keresés név vagy hozzávaló szerint" aria-label="Keresés">
    </div>
    <div class="chips" id="chips"></div>
    <div class="tagmgr" id="tagmgr" hidden></div>
  </header>
  <ul class="list" id="list"></ul>
</div>

<div class="actions" id="actions">
  <div class="inner">
    <button class="btn ghost" id="importBtn">Recept beolvasása</button>
    <button class="btn" id="new">Új recept</button>
  </div>
</div>

<div class="sheet" id="detail"><div class="wrap" id="detailBody"></div></div>
<div class="sheet" id="form"><div class="wrap" id="formBody"></div></div>

/* ---------- tárolás ---------- */
let recipes = [];
let storageOk = true;

async function rawGet(k){
  if(window.storage){
    try{ const r = await window.storage.get(k); if(r && r.value != null) return r; }catch(e){}
  }
  const v = localStorage.getItem(k);
  if(v == null) throw new Error('nincs mentett adat');
  return { value: v };
}

async function rawSet(k, val){
  if(window.storage){
    try{ await window.storage.set(k, val); return; }catch(e){}
  }
  localStorage.setItem(k, val);
}

async function load(){
  try{
    const r = await rawGet(KEY);
    const parsed = JSON.parse(r.value);
    if(!Array.isArray(parsed)) throw new Error('bad');
    recipes = parsed;
    if(syncSeeds()) await save(true);
  }catch(e){
    recipes = SEED.slice();
    await save(true);
  }
}

/* frissebb változatú alaprecept felülírja a korábban mentettet */
function syncSeeds(){
  let changed = false;
  SEED.forEach(s => {
    const i = recipes.findIndex(r => r.id === s.id);
    if(i === -1) return;
    if((recipes[i].v || 1) < (s.v || 1)){ recipes[i] = s; changed = true; }
  });
  /* régi, egykategóriás receptek átköltöztetése címkékre */
  recipes.forEach(r => {
    if(!Array.isArray(r.tags)){
      r.tags = r.category ? [r.category] : [];
      changed = true;
    }
  });
  return changed;
}
async function save(silent){
  try{
    await rawSet(KEY, JSON.stringify(recipes));
    storageOk = true;
  }catch(e){
    storageOk = false;
    if(!silent) toast('A mentés nem sikerült');
  }
}

  const t = document.createElement('div');

/* --- bemásolt szöveg szétszedése mezőkre --- */
const UNIT = /(dkg|dg|\bkg\b|\bg\b|\bdl\b|\bml\b|\bl\b|\bek\b|\btk\b|\bdb\b|csipet|csomag|gerezd|evőkanál|kávéskanál|teáskanál|marék|szál|fej|szelet|üveg|kanál)/i;
const NUTRI = /kcal|kalória|vitamin|zsírsav|koleszterin|micro|\bmg\b|%|ásványi|fehérje|szénhidrát|élelmi rost/i;
const STOP = /^(elkészítés|elkészítése|kalória|fehérje|szénhidrát|zsír|víz|koleszterin|élelmi rost|cukor|egy adagban|tápérték|recept infó|top |vitaminok|ásványi|összesen)/i;
const JUNK = /^(hirdetés|értékelés|hozzászólás|megosztás|nyomtatás|google|feliratkoz|jump to|skip to|advertisement|\d+[.,]?\d*\s*$)/i;

function parseRecipe(raw){
  const urls = [];
  let t = raw.replace(/\[([^\]]*)\]\(([^)]+)\)/g, (m, label, url) => { urls.push(url); return label; });
  let lines = t.split('\n')
    .map(l => l.replace(/^[\s*\-–•]+/, '').replace(/\s+/g, ' ').trim())
    .filter(l => l && !JUNK.test(l));

  const idx = re => lines.findIndex(l => re.test(l));
  const iIngr  = idx(/^hozzávalók?\b/i);
  const iSteps = idx(/^(elkészítés|elkészítése|leírás)\b/i);

  const looksIngr = l =>
    l.length < 70 && !NUTRI.test(l) && (/^\d/.test(l) || UNIT.test(l));

  /* hozzávalók */
  const ingredients = [];
  if(iIngr > -1){
    let miss = 0;
    for(let i = iIngr + 1; i < lines.length; i++){
      const l = lines[i];
      if(STOP.test(l)) break;
      if(looksIngr(l)){ ingredients.push(l); miss = 0; }
      else if(ingredients.length && ++miss > 3) break;
    }
  }

  /* elkészítés */
  const steps = [];
  if(iSteps > -1){
    for(let i = iSteps + 1; i < lines.length; i++){
      const l = lines[i];
      if(/^(recept infó|hozzászólás|kapcsolódó|címkék)/i.test(l)) break;
      const num = l.match(/^\d+[.)]\s*(.+)/);
      if(num) steps.push(num[1]);
      else if(steps.length && l.length > 40) steps.push(l);
      else if(!steps.length && l.length > 40) steps.push(l);
    }
  }

  /* cím: az első értelmes sor */
  const title = lines.find(l =>
    l.length > 2 && l.length < 80 && !/^https?:/.test(l) && !UNIT.test(l)) || '';

  /* idő */
  let time = '';
  const iTime = idx(/^idő$/i);
  if(iTime > -1 && lines[iTime+1]) time = lines[iTime+1].replace(/^(\d+)\s*p$/i, '$1 perc');
  if(!time){ const m = t.match(/(\d+)\s*perc/i); if(m) time = m[1] + ' perc'; }

  const source = urls
    .map(u => u.split('#')[0])
    .find(u => /^https?:/.test(u) && !/alapanyag|receptkonyv|szakacs|google|facebook|instagram/.test(u)) || '';

  return { title, ingredients, steps, time, source };
}

/* --- fotó a készülékről, kicsinyítve --- */
function readPhoto(file, done){
  const fr = new FileReader();
  fr.onload = () => {
    const img = new Image();
    img.onload = () => {
      const side = Math.min(img.width, img.height);
      const cv = document.createElement('canvas');
      cv.width = cv.height = 440;
      cv.getContext('2d').drawImage(img,
        (img.width - side)/2, (img.height - side)/2, side, side, 0, 0, 440, 440);
      done(cv.toDataURL('image/jpeg', 0.75));
    };
    img.onerror = () => done(null);
    img.src = fr.result;
  };
  fr.onerror = () => done(null);
  fr.readAsDataURL(file);
}

function fmtNum(n){
  const r = Math.round(n*100)/100;
  return String(r).replace('.', ',');
}
function scaleLine(line, factor){
  if(factor === 1) return line;
  return line.replace(/^(\d+(?:[.,]\d+)?)(\s*\/\s*(\d+))?/, (m, a, frac, b) => {
    let val = parseFloat(a.replace(',', '.'));
    if(b) val = val / parseFloat(b);
    return fmtNum(val * factor);
  });
}

/* ---------- lista ---------- */
let picked = [];      // kiválasztott címkék
let query = '';
let grouped = true;   // csoportosított nézet

const tagsOf = r => (Array.isArray(r.tags) && r.tags.length) ? r.tags
                  : (r.category ? [r.category] : []);
const mainTag = r => tagsOf(r)[0] || 'Egyéb';

function allTags(){
  const seen = new Map();
  recipes.forEach(r => tagsOf(r).forEach(t => seen.set(t, (seen.get(t)||0)+1)));
  return [...seen.entries()].sort((a,b) => b[1]-a[1] || a[0].localeCompare(b[0],'hu'));
}

function render(){
  document.getElementById('count').textContent =
    recipes.length ? recipes.length + ' recept a dobozban' + (storageOk?'':' — most nem tudok menteni')
                   : 'Üres doboz';

  /* címkesor */
  const tags = allTags();
  const chips = document.getElementById('chips');
  chips.innerHTML = tags.length
    ? `<button class="chip" data-tag="" aria-pressed="${!picked.length}">Mind</button>` +
      tags.map(([t,n]) =>
        `<button class="chip" data-tag="${esc(t)}" aria-pressed="${picked.includes(t)}">${esc(t)} <em>${n}</em></button>`
      ).join('') +
      `<button class="chip grp" id="grpBtn" aria-pressed="${grouped}">${grouped?'Csoportosítva':'Egy listában'}</button>`
    : '';

  /* egy címke kiválasztva → átnevezhető, levehető */
  const mgr = document.getElementById('tagmgr');
  if(picked.length === 1){
    mgr.hidden = false;
    mgr.innerHTML = `
      <input type="text" id="tagRename" value="${esc(picked[0])}" aria-label="Címke neve">
      <button class="btn ghost" id="tagSave">Átnevezés</button>
      <button class="btn danger" id="tagDrop">Címke levétele</button>`;
  }else{
    mgr.hidden = true; mgr.innerHTML = '';
  }

  const q = query.trim().toLowerCase();
  const shown = recipes.filter(r => {
    const rt = tagsOf(r);
    return picked.every(t => rt.includes(t)) &&
      (!q || (r.title + ' ' + rt.join(' ') + ' ' + (r.ingredients||[]).join(' ')).toLowerCase().includes(q));
  });

  const list = document.getElementById('list');
  if(!recipes.length){
    list.innerHTML = `<li class="empty">Még nincs recept itt.<br>Kezdd a <b>Recept beolvasása</b> gombbal, ha van bemásolható szöveged.</li>`;
    return;
  }
  if(!shown.length){
    list.innerHTML = `<li class="empty">Nincs találat erre: „${esc(query || picked.join(' + '))}”.</li>`;
    return;
  }

  const card = r => {
    const bits = [r.time, (r.ingredients||[]).length + ' hozzávaló'].filter(Boolean);
    return `<li><button class="card" data-id="${r.id}" style="--tab:${tabColor(mainTag(r))}">
      <span class="txt">
        <h3>${esc(r.title)}</h3>
        <p class="meta">${bits.map(esc).join(' · ')}</p>
        <p class="taglist">${tagsOf(r).map(t=>`<span>${esc(t)}</span>`).join('')}</p>
      </span>
      ${thumb(r)}
    </button></li>`;
  };

  if(grouped && !q && picked.length !== 1){
    const groups = new Map();
    shown.forEach(r => {
      const g = mainTag(r);
      if(!groups.has(g)) groups.set(g, []);
      groups.get(g).push(r);
    });
    list.innerHTML = [...groups.entries()]
      .sort((a,b) => a[0].localeCompare(b[0],'hu'))
      .map(([g, rs]) =>
        `<li class="grouphead" style="--tab:${tabColor(g)}">${esc(g)} <em>${rs.length}</em></li>` +
        rs.map(card).join('')
      ).join('');
  }else{
    list.innerHTML = shown.map(card).join('');
  }
}

  };

  document.getElementById('parseBtn').onclick = () => {
    const raw = document.getElementById('f-raw').value;
    if(!raw.trim()){ toast('Előbb illeszd be a szöveget'); return; }
    const p = parseRecipe(raw);
    const put = (id, val) => { if(val) document.getElementById(id).value = val; };
    put('f-title', p.title);
    put('f-time',  p.time);
    put('f-src',   p.source);
    put('f-ingr',  p.ingredients.join('\n'));
    put('f-steps', p.steps.join('\n'));
    const found = [];
    if(p.ingredients.length) found.push(p.ingredients.length + ' hozzávaló');
    if(p.steps.length) found.push(p.steps.length + ' lépés');
    toast(found.length ? 'Beolvasva: ' + found.join(', ') : 'Ebből nem sikerült kibontani semmit');
  };

  document.getElementById('f-file').onchange = ev => {
    const f = ev.target.files && ev.target.files[0];
    if(!f) return;
    document.getElementById('imgState').textContent = 'feldolgozás…';
    readPhoto(f, data => {
      if(!data){ document.getElementById('imgState').textContent = 'a kép nem olvasható'; return; }
      photo = data;
      document.getElementById('f-img').value = '';
      document.getElementById('imgState').textContent = 'fotó betöltve';
    });
  };

  document.getElementById('closeForm').onclick = () =>
    document.getElementById('form').classList.remove('open');

  document.getElementById('saveBtn').onclick = async () => {
    const v = id => document.getElementById(id).value.trim();
    const lines = id => v(id).split('\n').map(s=>s.trim()).filter(Boolean);
    if(!v('f-title')){ toast('A név nem maradhat üresen'); return; }
    if(document.getElementById('f-tag').value.trim()) addTag();
    const data = {
      id: e.id || 'r-' + Date.now(),
      v: e.v,
      title: v('f-title'),
      tags: formTags,
      category: formTags[0] || '',
      source: v('f-src'),
      image: photo || v('f-img'),
      time: v('f-time'),
      servings: Math.max(1, parseInt(v('f-serv')) || 4),
      ingredients: lines('f-ingr'),
      steps: lines('f-steps'),
      notes: v('f-notes')
    };
    const i = recipes.findIndex(x => x.id === data.id);
    if(i > -1) recipes[i] = data; else recipes.unshift(data);
    await save();
    document.getElementById('form').classList.remove('open');
    render();
    if(document.getElementById('detail').classList.contains('open')){
      current = data; portions = data.servings; drawDetail();
    }
    toast(i > -1 ? 'Módosítva' : 'Bekerült a dobozba');
  };
}

/* ---------- események ---------- */
document.getElementById('list').addEventListener('click', ev => {
  const c = ev.target.closest('.card');
  if(c) openDetail(c.dataset.id);
});
document.getElementById('chips').addEventListener('click', ev => {
  const c = ev.target.closest('.chip');
  if(!c) return;
  if(c.id === 'grpBtn'){ grouped = !grouped; render(); return; }
  const t = c.dataset.tag;
  if(!t) picked = [];
  else picked = picked.includes(t) ? picked.filter(x => x !== t) : [...picked, t];
  render();
});

document.getElementById('tagmgr').addEventListener('click', async ev => {
  const old = picked[0];
  if(ev.target.id === 'tagSave'){
    const val = document.getElementById('tagRename').value.trim();
    if(!val || val === old) return;
    recipes.forEach(r => {
      const rt = tagsOf(r);
      if(!rt.includes(old)) return;
      r.tags = [...new Set(rt.map(t => t === old ? val : t))];
      r.category = r.tags[0];
    });
    picked = [val];
    await save(); render();
    toast('Átnevezve: ' + val);
  }
  if(ev.target.id === 'tagDrop'){
    recipes.forEach(r => {
      const rt = tagsOf(r);
      if(!rt.includes(old)) return;
      r.tags = rt.filter(t => t !== old);
      r.category = r.tags[0] || '';
    });
    picked = [];
    await save(); render();
    toast('Címke levéve a receptekről');
  }
});
document.getElementById('q').addEventListener('input', ev => { query = ev.target.value; render(); });
document.getElementById('new').addEventListener('click', () => openForm(null, false));
document.getElementById('importBtn').addEventListener('click', () => openForm(null, true));
document.addEventListener('keydown', ev => {
  if(ev.key === 'Escape') document.querySelectorAll('.sheet.open').forEach(s => s.classList.remove('open'));
});

(async () => { await load(); render(); })();
</script>
