<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__PROJECT_NAME__</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, sans-serif;
    background: Canvas;
    color: CanvasText;
  }
  main { max-width: 32rem; padding: 2rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; letter-spacing: -.02em; }
  p { margin: 0 0 1.5rem; opacity: .7; }
  code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: .875em;
    padding: .15em .4em;
    border-radius: .25rem;
    background: color-mix(in srgb, CanvasText 8%, transparent);
  }
  ul { padding-left: 1.2rem; margin: 0; }
  li { margin-bottom: .4rem; }
  #health { opacity: .7; font-size: .875rem; margin-top: 1.5rem; }
</style>
</head>
<body>
<main>
  <h1>__PROJECT_NAME__</h1>
  <p>__PROJECT_DESCRIPTION__</p>

  <ul>
    <li>Statikus fájlok: <code>public/</code></li>
    <li>Worker logika: <code>src/index.js</code></li>
    <li>Helyi futtatás: <code>npm run dev</code></li>
    <li>Deploy: <code>npm run deploy</code></li>
  </ul>

  <div id="health">Worker állapot ellenőrzése…</div>
</main>

<script>
  fetch("/api/health")
    .then((r) => r.json())
    .then((d) => {
      document.getElementById("health").textContent =
        "Worker válaszol: " + d.status + " — " + d.time;
    })
    .catch(() => {
      document.getElementById("health").textContent =
        "A Worker nem válaszol.";
    });
</script>
</body>
</html>
