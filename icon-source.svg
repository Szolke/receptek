<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A322A"/>
      <stop offset="100%" stop-color="#221F1A"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C77F4F"/>
      <stop offset="100%" stop-color="#A8623A"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFCF5"/>
      <stop offset="100%" stop-color="#EDE7DB"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- recipe card peeking up from behind the box -->
  <g transform="rotate(-5 512 400)">
    <rect x="357" y="210" width="310" height="380" rx="18" fill="url(#card)" stroke="#D8CDB6" stroke-width="6"/>
    <g stroke="#B5442E" stroke-width="11" stroke-linecap="round">
      <line x1="405" y1="285" x2="600" y2="285"/>
      <line x1="405" y1="328" x2="618" y2="328"/>
    </g>
    <g stroke="#C9A98C" stroke-width="9" stroke-linecap="round">
      <line x1="405" y1="392" x2="600" y2="392"/>
      <line x1="405" y1="432" x2="580" y2="432"/>
      <line x1="405" y1="472" x2="605" y2="472"/>
      <line x1="405" y1="512" x2="545" y2="512"/>
    </g>
  </g>

  <!-- recipe box -->
  <g>
    <rect x="182" y="592" width="660" height="304" rx="36" fill="url(#box)"/>
    <rect x="182" y="592" width="660" height="76" rx="20" fill="#8B4A2B"/>
    <rect x="470" y="592" width="84" height="76" fill="#8B4A2B"/>
  </g>

  <!-- fork accent, in front of the box, bottom-right -->
  <g transform="rotate(24 700 700)" fill="#EDE0C8">
    <rect x="684" y="560" width="20" height="140" rx="10"/>
    <rect x="712" y="560" width="20" height="140" rx="10"/>
    <rect x="740" y="560" width="20" height="140" rx="10"/>
    <path d="M 684 686 Q 684 726 722 726 Q 760 726 760 686 L 760 686 Q 760 706 722 706 Q 684 706 684 686 Z" fill="#EDE0C8"/>
    <rect x="710" y="712" width="24" height="230" rx="12"/>
  </g>
</svg>
